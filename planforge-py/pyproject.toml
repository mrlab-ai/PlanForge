[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "planforge"
requires-python = ">=3.10"
description = "Python bindings for the PlanForge numeric planner"
dependencies = ["numpy>=1.26"]
dynamic = ["version"]

[tool.maturin]
module-name = "planforge"
features = ["pyo3/extension-module"]
