[package]
name = "planforge-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PlanForge's search core: search algorithms, the heuristic interface and registry, successor generation, task transformations."
repository = "https://github.com/mrlab-ai/PlanForge"
readme = "../README.md"
keywords = ["planning", "heuristics", "search", "algorithms"]
categories = ["algorithms", "science", "mathematics"]
license = "LGPL-3.0"

[dependencies]
planforge-sas = { path = "../planforge-sas", version = "0.1.0" }
planforge-config-derive = { path = "../planforge-config-derive", version = "0.1.0" }
libc = "0.2"
tracing = "0.1"
ordered-float = "5.1.0"
serde_json = "1"
itertools = "0.13"
rand = { version = "0.8", features = ["small_rng"] }
rustc-hash = "2"

[features]
# Exposes the small tasks of the unit tests to the heuristics' tests.
test-tasks = []

[dev-dependencies]
planforge-translate = { path = "../planforge-translate", version = "0.1.0" }
