[workspace]
default-members = [
    "planforge-sas",
    "planforge-translate",
    "planforge-translator",
    "planforge-search",
    "planforge-searcher",
    "planforge",
    "planforge-cli-utils",
    "planforge-portfolio",
    "planforge-config-derive",
    "planforge-sgd",
    "tests",
]

members = [
    "planforge-sas",
    "planforge-translate",
    "planforge-translator",
    "planforge-search",
    "planforge-searcher",
    "planforge",
    "planforge-py",
    "planforge-cli-utils",
    "planforge-portfolio",
    "planforge-config-derive",
    "planforge-cplex",
    "planforge-sgd",
    "tutorials/rust-goal-count",
    "tests",
]

resolver = "2"

[profile.release]
lto = true
# `codegen-units = 1` allows a more optimized compilation.
codegen-units = 1

# Fast optimization profile for iterative SGD experiments. Full LTO makes every
# one-line loss change spend more than a minute relinking the planner, while the
# optimizer itself needs optimized tensor loops to be measurable.
[profile.experiment]
inherits = "release"
lto = false
codegen-units = 16
# Uncomment this for profiling.
debug = "line-tables-only"
