name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings rather than letting them accumulate.
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    # Blocking. The backlog reached zero across every crate, with no
    # `#[allow]` added to get there -- the `too_many_arguments` cases were
    # resolved by extracting parameter structs, and the 68
    # `arc_with_non_send_sync` cases by making the task genuinely `Send + Sync`
    # rather than by silencing the lint.
    #
    # Caveat worth knowing: roughly 70 `#[allow(clippy::...)]` attributes
    # predate this gate, mostly `too_many_arguments` in planforge-search and
    # planforge-sgd. A zero count therefore means "no new lints", not "no
    # lints" -- this job will not catch anything hiding behind those. Clearing
    # them means refactoring ~50 more 8-to-13-parameter functions.
    #
    # Re-measure with
    #   cargo clippy --workspace --exclude planforge-cplex --all-targets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `planforge-cplex` links against a proprietary CPLEX installation that
      # is not available to CI, so it is excluded everywhere below.
      - run: cargo clippy --workspace --exclude planforge-cplex --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This is the real correctness gate, and it is why there is no separate
      # benchmark job: the `tests` crate asserts the known optimal cost and plan
      # length of every fixture in tests/assets/numeric-pddl-files,
      # .../sailing-simple, .../strips-pddl-files and .../numeric-conditions,
      # and each table is compared set-wise against the fixtures on disk. A
      # planner regression changes a plan cost and this fails.
      #
      # Three sailing-simple optima are the exception and are covered by
      # `release-test` below, not here. The set-wise comparison that makes those
      # tables load-bearing still runs in this job, so an unpinned fixture fails
      # here regardless.
      - run: cargo test --workspace --exclude planforge-cplex

  release-test:
    name: release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `blind_astar_reproduces_every_costly_sailing_simple_optimum` is
      # `cfg(not(debug_assertions))`, so the unoptimized `test` job above does not
      # compile it and this is the only job that runs it. It verifies the three
      # sailing-simple instances that are 87% of that corpus's 883_859 blind-A*
      # expansions: 66s of search unoptimized against 3.5s optimized, which is
      # why it is here rather than there.
      #
      # `-p tests` rather than the whole workspace because that is the only crate
      # with optimized-only cases, and the whole `tests` crate optimized is 8s of
      # test time -- the cost of this job is the build, which the cache absorbs.
      # Not `#[ignore]`: an earlier audit removed six ignored tests, two of which
      # had been silently broken for a long time, so nothing here is opt-in.
      - run: cargo test -p tests --release

  features:
    name: optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `sgd` is off by default, so nothing else in CI would compile it and it
      # would rot unnoticed. Checking it here keeps the gradient engine and its
      # candle backend building without imposing them on the default build.
      - run: cargo check -p planforge --features sgd
      - run: cargo test -p planforge-sgd --features candle
      # tests/src/sgd_engine_tests.rs is `#![cfg(feature = "sgd")]`, and the
      # `test` job builds the default feature set, so nothing compiled this file
      # at all until now - it went stale under a harness change and no job
      # noticed. Compile-only on purpose: those tests are end-to-end solves of
      # several thousand optimizer updates, which is minutes in an unoptimized
      # build, and `cargo test -p planforge-sgd --features candle` above already
      # exercises the engine. Run them by hand with
      # `cargo test -p tests --features sgd`.
      - run: cargo check -p tests --features sgd --all-targets

  default-build-is-lean:
    name: default build excludes optional backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The point of the `sgd` feature is that a default build never compiles
      # the autograd backend. Assert it, rather than trusting the manifest:
      # candle appears in Cargo.lock either way, so only the build graph is
      # evidence.
      - name: candle must not be in the default build graph
        run: |
          for crate in planforge tests; do
            count=$(cargo tree -p "$crate" -e normal | grep -c candle || true)
            if [ "$count" -ne 0 ]; then
              echo "::error::$crate pulls in $count candle entries in a default build"
              exit 1
            fi
          done
