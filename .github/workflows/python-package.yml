name: Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-wheels:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Enable emulation for cross-architecture containers
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.7.8
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --manifest-path planforge-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  macos-wheels:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.7.8
          target: ${{ matrix.target }}
          args: --release --locked --manifest-path planforge-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  windows-wheel:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.7.8
          target: x86_64-pc-windows-msvc
          args: --release --locked --manifest-path planforge-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-x86_64-pc-windows-msvc
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: v1.7.8
          args: --manifest-path planforge-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

# Publishing is intentionally disabled. After configuring a PyPI token or
# trusted publishing, add a tag-only job that downloads these artifacts and
# runs `maturin upload`; do not publish from ordinary CI runs.
