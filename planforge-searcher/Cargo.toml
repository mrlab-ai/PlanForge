[package]
name = "planforge-searcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Configuration-driven selection and construction of PlanForge search algorithms."
repository = "https://github.com/mrlab-ai/PlanForge"
readme = "../README.md"
keywords = ["planning", "heuristics", "search", "configuration"]
categories = ["algorithms", "science"]
license = "GPL-3.0"

[features]
# Forward to planforge-search's native CPLEX backend.
cplex = ["planforge-search/cplex"]
# The gradient engine, which drags in the candle autograd backend.
sgd = ["dep:planforge-sgd", "planforge-sgd/candle"]

[dependencies]
planforge-sas = { path = "../planforge-sas", version = "0.1.0" }
planforge-search = { path = "../planforge-search", version = "0.1.0" }
tracing = { version = "0.1", features = ["log"] }
planforge-sgd = { path = "../planforge-sgd", version = "0.1.0", optional = true }
