<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 308 360 331" width="360" height="331" role="img" aria-labelledby="pf-mark-title">
  <title id="pf-mark-title">PlanForge: an anvil with a search graph on its face</title>

  <!-- Hand-drawn artwork. Geometry is unmodified; only the framing changed from
       the drawing file: the opaque background rectangle is gone so the mark sits
       on any colour, and the viewBox is cropped to the ink (28,320 to 364,627)
       plus a 12 unit margin, instead of the 1024 square canvas that was mostly
       empty. The gradient id is namespaced so it cannot collide when this file
       is inlined next to another SVG. logo.svg holds this same mark plus the
       wordmark in the same coordinate frame. Keep the two in step. -->

  <style>
    /* Colours live here rather than only in presentation attributes so the dark
       scheme below can override them. The presentation attributes are kept as a
       fallback for renderers that ignore stylesheets; CSS wins where both apply.

       In the dark scheme the navy gradient flips to light steel, so the anvil
       does not disappear into a dark page. Everything drawn on top of the anvil
       then has to invert too, or it would vanish in turn: the graph links and
       the node rings go dark, the highlight strokes go dark, and the
       construction marks lighten. The sparks are left alone, because the orange
       carries on either background. */
    .g1 { stop-color: #0c2439 }
    .g2 { stop-color: #061727 }
    .guides { stroke: #6e7883 }
    .hl { stroke: #d8dee3 }
    .links { stroke: #ffffff }
    .ring { fill: #f5f6f7 }
    .core { fill: #9ca3aa }

    @media (prefers-color-scheme: dark) {
      .g1 { stop-color: #dbe3ea }
      .g2 { stop-color: #aebbc7 }
      .guides { stroke: #8a949f }
      .hl { stroke: #7e8b98 }
      .links { stroke: #0d2135 }
      .ring { fill: #0d2135 }
      .core { fill: #6d7a87 }
    }
  </style>

  <defs>
    <linearGradient id="pf-navy" x1="0" y1="0" x2="0" y2="1">
      <stop class="g1" offset="0" stop-color="#0c2439"/>
      <stop class="g2" offset="1" stop-color="#061727"/>
    </linearGradient>
  </defs>

  <!-- construction marks -->
  <g class="guides" fill="none" stroke="#6e7883" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <path d="M64 416 H174" stroke-dasharray="7 9"/>
    <path d="M64 416 V443" stroke-dasharray="7 9"/>
    <path d="M64 405 V428 M53 416 H75"/>
    <path d="M64 493 V574" stroke-dasharray="7 9"/>
    <path d="M64 574 H167" stroke-dasharray="7 9"/>
    <path d="M101 614 V581" stroke-dasharray="7 9"/>
    <path d="M89 614 H116 M101 602 V626"/>
    <path d="M101 602 C101 560 119 538 151 531" stroke-dasharray="7 9"/>
    <path d="M325 474 C345 499 351 528 344 562" stroke-dasharray="7 9"/>
  </g>

  <!-- spark -->
  <g fill="#ff6800">
    <path d="M221 320 L230 397 L214 421 Z"/>
    <path d="M181 371 L210 415 L196 421 Z"/>
    <path d="M258 371 L235 418 L248 412 Z"/>
    <path d="M172 400 L201 421 L190 425 Z"/>
    <path d="M274 393 L248 417 L258 419 Z"/>
    <path d="M181 418 L204 431 L188 429 Z"/>
    <path d="M261 418 L237 431 L251 430 Z"/>
  </g>

  <!-- anvil -->
  <path fill="url(#pf-navy)" d="     M28 449     C55 449 89 450 142 450     L142 437     L365 437     L365 462     C333 467 305 481 290 501     C275 520 277 549 290 573     C297 585 305 593 316 597     L325 597     L325 617     L133 617     L133 597     L147 597     C160 585 171 565 174 546     C177 527 170 513 157 503     C145 494 128 489 108 486     C78 481 49 467 28 449 Z"/>

  <!-- subtle top and base highlights -->
  <path d="M145 439 C197 451 284 444 354 439" fill="none" class="hl" stroke="#d8dee3" stroke-width="2" opacity="0.9"/>
  <path d="M137 597 C184 592 257 594 321 598" fill="none" class="hl" stroke="#d8dee3" stroke-width="2" opacity="0.8"/>

  <!-- graph links -->
  <g class="links" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M191 497 L305 456"/>
    <path d="M191 497 L258 549"/>
    <path d="M258 549 L201 602"/>
  </g>

  <!-- graph nodes -->
  <g>
    <circle cx="305" cy="456" r="17" class="ring" fill="#f5f6f7"/>
    <circle cx="305" cy="456" r="9" class="core" fill="#9ca3aa"/>
    <circle cx="191" cy="497" r="17" class="ring" fill="#f5f6f7"/>
    <circle cx="191" cy="497" r="9" class="core" fill="#9ca3aa"/>
    <circle cx="258" cy="549" r="17" class="ring" fill="#f5f6f7"/>
    <circle cx="258" cy="549" r="9" class="core" fill="#9ca3aa"/>
    <circle cx="201" cy="602" r="17" class="ring" fill="#f5f6f7"/>
    <circle cx="201" cy="602" r="9" class="core" fill="#9ca3aa"/>
  </g>

</svg>
