<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 364 446 421" width="446" height="421" role="img" aria-labelledby="pf-mark-title pf-mark-desc">
  <title id="pf-mark-title">PlanForge</title>
  <desc id="pf-mark-desc">An anvil under a burst of sparks, with a four node search graph across its face. Construction guides are drawn around it.</desc>

  <!-- Hand-drawn artwork. Geometry is unmodified. What changed from the drawing
       file is only what a web asset needs: the opaque background rectangle is
       gone so the logo sits on any colour, the viewBox is cropped to the ink
       of the mark alone (32,376 to 454,773) with an even 12 unit margin, the ids
       are namespaced so they cannot collide if this file is ever inlined next to
       another SVG, and the colours moved into a stylesheet so the dark scheme
       below can reach them.

       logo.svg holds this same mark plus the wordmark in the same coordinate
       frame, and favicon.svg a reduction of it. Keep all three in step. -->

  <style>
    /* The artwork is navy on transparent, which disappears against a dark page.
       For a reader who prefers a dark scheme the navy gradient flips to light
       steel, and everything drawn on top of the anvil inverts with it or it
       would vanish in turn: the graph links and node rings go dark, the metal
       highlights go dark, and the construction guides lighten. The sparks need
       no variant, because the orange carries on either background.

       Colours live here rather than only in presentation attributes so the media
       query can override them. The attributes stay as a fallback for renderers
       that ignore stylesheets, and CSS wins where both apply. */
    .n1 { stop-color: #0b2942 }
    .n2 { stop-color: #071c2f }
    .n3 { stop-color: #041523 }
    .guides { stroke: #77838e }
    .hl { stroke: #edf2f5 }
    .links { stroke: #f8fafb }
    .ring { fill: #f7f8f9 }
    .core { fill: #aeb5bb }

    @media (prefers-color-scheme: dark) {
      .n1 { stop-color: #e6edf3 }
      .n2 { stop-color: #ccd8e1 }
      .n3 { stop-color: #b0bfcb }
      .guides { stroke: #8d99a5 }
      .hl { stroke: #5d6b78 }
      .links { stroke: #0a1c2e }
      .ring { fill: #0a1c2e }
      .core { fill: #616e7b }
    }
  </style>

  <defs>
    <linearGradient id="pf-navy" x1="0" y1="0" x2="0.9" y2="1">
      <stop class="n1" offset="0" stop-color="#0b2942"/>
      <stop class="n2" offset="0.55" stop-color="#071c2f"/>
      <stop class="n3" offset="1" stop-color="#041523"/>
    </linearGradient>
    <linearGradient id="pf-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#ff5900"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn technical construction guides -->
  <g class="guides" fill="none" stroke="#77838e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 496 H218" stroke-dasharray="10 11"/>
    <path d="M82 496 V534" stroke-dasharray="10 11"/>
    <path d="M82 594 V702" stroke-dasharray="10 11"/>
    <path d="M82 702 H211" stroke-dasharray="10 11"/>
    <path d="M202 754 V717" stroke-dasharray="10 11"/>
    <path d="M203 718 C198 667 233 627 286 613" stroke-dasharray="10 11"/>
    <path d="M406 568 C442 611 446 671 413 719" stroke-dasharray="10 11"/>
    <path d="M82 478 V514 M64 496 H100"/>
    <path d="M82 684 V720 M64 702 H100"/>
    <path d="M202 736 V772 M184 754 H220"/>
  </g>

  <!-- Forging sparks -->
  <g fill="url(#pf-orange)">
    <path d="M276 376 L286 463 L276 508 L266 463 Z"/>
    <path d="M226 441 L263 501 L244 489 Z"/>
    <path d="M326 441 L289 501 L308 489 Z"/>
    <path d="M214 477 L248 505 L226 498 Z"/>
    <path d="M338 477 L304 505 L326 498 Z"/>
    <path d="M218 507 L249 517 L232 520 Z"/>
    <path d="M334 507 L303 517 L320 520 Z"/>
  </g>

  <!-- Anvil mark, constructed from original paths rather than a raster trace -->
  <g>
    <path fill="url(#pf-navy)" d="
      M32 541
      C72 541 118 542 177 541
      L177 526
      H455
      V559
      C415 564 386 581 371 607
      C349 645 359 691 401 728
      H414
      V753
      H164
      V728
      H181
      C205 708 218 682 214 657
      C211 636 198 621 175 614
      C116 603 70 582 32 541 Z"/>

    <!-- crisp metal highlights -->
    <path d="M39 546 C90 550 132 551 168 552" fill="none" class="hl" stroke="#edf2f5" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M184 531 C253 542 345 538 441 532" fill="none" class="hl" stroke="#edf2f5" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M175 730 C241 724 324 725 402 729" fill="none" class="hl" stroke="#edf2f5" stroke-width="3" stroke-linecap="round" opacity="0.78"/>

    <!-- graph connections -->
    <g class="links" fill="none" stroke="#f8fafb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M238 603 L385 548"/>
      <path d="M238 603 L326 668"/>
      <path d="M326 668 L249 741"/>
    </g>

    <!-- graph nodes -->
    <g>
      <circle cx="385" cy="548" r="24" class="ring" fill="#f7f8f9"/>
      <circle cx="385" cy="548" r="14" class="core" fill="#aeb5bb"/>
      <circle cx="238" cy="603" r="24" class="ring" fill="#f7f8f9"/>
      <circle cx="238" cy="603" r="14" class="core" fill="#aeb5bb"/>
      <circle cx="326" cy="668" r="24" class="ring" fill="#f7f8f9"/>
      <circle cx="326" cy="668" r="14" class="core" fill="#aeb5bb"/>
      <circle cx="249" cy="741" r="24" class="ring" fill="#f7f8f9"/>
      <circle cx="249" cy="741" r="14" class="core" fill="#aeb5bb"/>
    </g>
  </g>
</svg>
