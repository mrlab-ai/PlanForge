      C953 604 969 620 969 644 V654
      C969 679 953 694 929 694 H907
      C883 694 868 679 868 654 V644
      C868 620 883 604 907 604 Z
      M908 623
      C897 623 890 631 890 642 V656
      C890 667 897 675 908 675 H928
      C939 675 947 667 947 656 V642
      C947 631 939 623 928 623 Z"/>

    <!-- r -->
    <path d="
      M979 694 V641
      C979 617 994 604 1017 604 H1034 V624 H1018
      C1007 624 1001 631 1001 642 V694 Z"/>

    <!-- g -->
    <path d="
      M1077 604 H1127 V689
      C1127 714 1111 729 1088 729 H1046 V710 H1087
      C1098 710 1105 703 1105 692 H1078
      C1055 692 1040 677 1040 654 V642
      C1040 619 1055 604 1077 604 Z
      M1079 623
