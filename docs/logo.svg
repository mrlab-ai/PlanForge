  <title id="pf-logo-title">PlanForge</title>

  <!-- Hand-drawn artwork. Geometry is unmodified; only the framing changed from
       the drawing file: the opaque background rectangle is gone so the logo sits
       on any colour, and the viewBox is cropped to the ink (28,320 to 991,627)
       plus a 12 unit margin, instead of the 1024 square canvas that was 70%
       empty. The gradient id is namespaced so it cannot collide when this file
       is inlined next to another SVG. logo-mark.svg holds the mark alone in the
       same coordinate frame; keep the two in step. -->

  <defs>
    <linearGradient id="pf-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2439"/>
      <stop offset="1" stop-color="#061727"/>
    </linearGradient>
  </defs>

