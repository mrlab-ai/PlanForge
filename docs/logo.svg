      M592 565 H614 V661
      C614 671 618 675 621 675 H623 V694 H617
      C601 694 592 684 592 666 Z"/>

    <!-- a -->
    <path d="
      M638 604 H677
      C699 604 712 619 712 641 V694 H660
      C644 694 632 681 632 662
      C632 642 644 630 662 630 H690 V636
      C690 627 684 621 675 621 H638 Z
      M662 649
      C655 649 650 654 650 662
      C650 670 655 676 662 676 H690 V649 Z"/>

    <!-- n -->
    <path d="
      M721 694 V604 H770
      C793 604 808 620 808 643 V694 H785 V644
      C785 631 777 623 765 623 H744 V694 Z"/>

    <!-- f -->
