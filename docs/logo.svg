      C1062 666 1069 674 1080 674 H1105 V623 Z"/>

    <!-- e -->
    <path d="
      M1180 604 H1193
      C1212 604 1223 617 1223 637 V655 H1163 V658
      C1163 669 1171 676 1182 676 H1217 V694 H1181
      C1157 694 1141 679 1141 655 V643
      C1141 620 1157 604 1180 604 Z
      M1163 637 H1201 V634
      C1201 626 1195 622 1187 622 H1179
      C1170 622 1163 628 1163 637 Z"/>
  </g>
</svg>
